<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/assets/styles/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-spacer"></div>
        <div class="header-content">
            <div class="header-branding">
                <img src="src/assets/images/Logo1.png" style="width: 63px; height: auto;" alt="Logo 1">
                <img src="src/assets/images/Logo2.png" style="width: 95px; height: auto;" alt="Logo 2">
            </div>

            <nav class="header-nav">
                <ul class="nav-list">
                    <li class="nav-item-selected">Home</li>
                    <li class="nav-item">Story</li>
                    <li class="nav-item">Gallery</li>
                    <li class="nav-item">Contact Us</li>
                </ul>

                <div class="nav-divider">
                    <span class="nav-divider__spacer"></span>
                    <span class="nav-divider__line"></span>
                    <span class="nav-divider__spacer"></span>
                </div>

                <ul class="nav-icons">
                    <img src="src/assets/images/HeaderProfileIcon.png" alt="Profile">
                    <img src="src/assets/images/HeaderSearchIcon.png" alt="Search">
                </ul>
            </nav>
        </div>
        <div class="header-spacer"></div>
    </header>

    <div class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-horizontal-alignment">
                <div class="hero-left-spacer"></div>
                <div class="herro-content">
                    <h2 class="hero-title">
                        <div style="display:inline; color: #8A53FF;">Let's talk about </div>your
                        <br>
                        your next trip!
                    </h2>
                    <p class="hero-subtitle">
                        Share your favorite travel destination and we will
                        <br> feature it in our next
                        blog!
                    </p>
                    <div class="hero-blocks">
                        <div class="hero-block-active">Share your story</div>
                        <div class="watch-block">
                            <div class="watch-button"></div>
                            Watch highlights
                        </div>
                    </div>
                </div>
                <div class="HersroRightSpacer"></div>
            </div>
        </div>
    </div>
</body>

</html>
